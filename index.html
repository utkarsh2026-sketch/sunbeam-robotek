<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunbeam Robotek Roborace</title>
    <!-- Load Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            margin-bottom: 30px;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
            background-color: #334155;
            color: #94a3b8;
        }
        .status-badge.online {
            background-color: #064e3b;
            color: #34d399;
        }
        .status-badge.offline {
            background-color: #7f1d1d;
            color: #f87171;
        }
        form {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        button {
            padding: 10px 20px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            color: #94a3b8;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        tr:hover {
            background-color: #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sunbeam Robotek Roborace</h1>
        <p>Live Event Leaderboard</p>
    </header>

    <div class="container">
        <div id="status" class="status-badge">Connecting to Supabase...</div>

        <!-- Form to Add New Entry -->
        <form id="teamForm">
            <input type="text" id="teamName" placeholder="Team Name" required />
            <input type="number" id="teamScore" placeholder="Score / Time (s)" required />
            <button type="submit">Submit Score</button>
        </form>

        <!-- Leaderboard Table -->
        <table>
            <thead>
                <tr>
                    <th>Team</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard">
                <tr>
                    <td colspan="2" style="text-align: center; color: #64748b;">Loading scores...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 1. Supabase Credentials
        const SUPABASE_URL = 'https://hdpmuwvdpzydxpwopxxy.supabase.co';
        
        // REPLACE THIS STRING WITH YOUR ACTUAL ANON KEY FROM SUPABASE SETTINGS
        const SUPABASE_ANON_KEY = 'sb_secret_9Xq6B-BIm5HPgqG_BBVzww_vezcjDDM';

        // 2. Initialize Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const statusEl = document.getElementById('status');
        const leaderboardEl = document.getElementById('leaderboard');
        const teamForm = document.getElementById('teamForm');

        // 3. Fetch Data and Display
        async function fetchScores() {
            const { data, error } = await supabaseClient.from('teams').select('*').order('score', { ascending: false });

            if (error) {
                statusEl.textContent = 'Connection Error: ' + error.message;
                statusEl.className = 'status-badge offline';
                leaderboardEl.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #f87171;">Failed to load data. Ensure "teams" table exists with RLS configured.</td></tr>';
            } else {
                statusEl.textContent = '● Connected to Supabase';
                statusEl.className = 'status-badge online';
                
                if (data.length === 0) {
                    leaderboardEl.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #94a3b8;">No scores recorded yet.</td></tr>';
                } else {
                    leaderboardEl.innerHTML = data.map(team => `
                        <tr>
                            <td><strong>${team.team_name}</strong></td>
                            <td>${team.score}</td>
                        </tr>
                    `).join('');
                }
            }
        }

        // 4. Handle Form Submission
        teamForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('teamName').value;
            const score = parseInt(document.getElementById('teamScore').value);

            const { error } = await supabaseClient.from('teams').insert([{ team_name: name, score: score }]);

            if (error) {
                alert('Error submitting score: ' + error.message);
            } else {
                document.getElementById('teamName').value = '';
                document.getElementById('teamScore').value = '';
                fetchScores(); // Refresh list
            }
        });

        // Run on load
        fetchScores();
    </script>
</body>
</html>
